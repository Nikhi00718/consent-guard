[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consentguard-research"
version = "0.1.0"
description = "Consent-state-aware visual privacy redaction research prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "tensorboard>=2.18,<3",
  "pycocotools>=2.0.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
mask2former = ["transformers>=5.1,<6", "accelerate>=1.1,<2", "safetensors>=0.5,<1"]
app = ["gradio>=5,<7"]
specialists = ["zxing-cpp>=2.2,<3", "paddleocr>=3,<4"]

[tool.setuptools]
package-dir = {"" = "main_project/src"}

[tool.setuptools.packages.find]
where = ["main_project/src"]

[tool.pytest.ini_options]
testpaths = ["main_project/tests"]
addopts = "-ra"
