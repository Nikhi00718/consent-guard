# Phase 1/3 preprocessing contract. Raw images and annotations are read-only.

decode:
  formats: [jpg, jpeg, png, gif]
  color_order: RGB
  reject_animation: true
  verify_decodes: true
  keep_raw_files: true

geometry:
  annotation_coordinates: source_annotation_space
  scale_to_decoded_image: true
  preserve_aspect_ratio: true
  permanent_resize: false
  keep_small_instances: true

training_loader:
  baseline_resize_short_side: 512
  baseline_max_long_side: 1024
  batch_size: 1
  gradient_accumulation_steps: 4
  mixed_precision: true
  first_smoke_run_augmentation: none
  later_augmentations:
    - synchronized_horizontal_flip_only_after_text_review
    - mild_brightness_contrast

validation_and_test:
  deterministic_resize: true
  random_augmentation: false
  use_test_only_for_final_report: true

privacy_safety:
  do_not_train_on_redacted_images: true
  do_not_write_ocr_values_to_logs: true
  metadata_free_exports_only: true
