experiment:
  name: specialist_handwriting_hiertext_maskrcnn
  seed: 1337
  output_dir: artifacts/checkpoints/specialist_handwriting_hiertext_maskrcnn
  deterministic: false
  cudnn_benchmark: true

data:
  train_records: artifacts/kaggle/processed/handwriting/records_train.jsonl
  val_records: artifacts/kaggle/processed/handwriting/records_val.jsonl
  class_map: artifacts/kaggle/processed/handwriting/class_map.json
  short_side: 640
  max_long_side: 1024
  crop_size: 640
  crop_probability: 0.80
  crop_context_factor: 4.0
  min_crop_visibility: 0.25
  horizontal_flip_probability: 0.0
  brightness_contrast_probability: 0.15
  num_workers: 2
  sampling: class_balanced
  class_balance_power: 0.25
  max_class_balance_ratio: 5.0
  negative_sampling_weight: 0.35

model:
  name: maskrcnn_resnet50_fpn_v2
  pretrained: true
  trainable_backbone_layers: 3
  small_object_anchors: true
  class_agnostic_mask: true
  detections_per_image: 200
  rpn_pre_nms_top_n_train: 500
  rpn_post_nms_top_n_train: 250
  rpn_pre_nms_top_n_test: 250
  rpn_post_nms_top_n_test: 200
  box_batch_size_per_image: 128

optimizer:
  name: adamw
  learning_rate: 0.0001
  momentum: 0.9
  weight_decay: 0.0001
  gradient_clip_norm: 10.0
  warmup_steps: 500
  warmup_start_factor: 0.01

training:
  device: cuda
  epochs: 15
  batch_size: 1
  gradient_accumulation_steps: 4
  amp: true
  log_every_steps: 25
  save_every_epochs: 1
  evaluate_every_epochs: 1
  max_steps: null
  resume_from: null

scheduler: {name: cosine, step_size: 10, gamma: 0.1}
evaluation: {enabled: true, score_threshold: 0.0, class_metrics: true, max_batches: null}
