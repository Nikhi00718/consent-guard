# Personal-tool coverage profile.
#
# Goal: catch more than the precision-tuned research profile, because a false
# alarm costs one un-erase click while a miss leaks. But "lower every
# threshold" is not that trade: at score 0.06 a real photo produced 2,431
# detections whose union covered 99.6% of the image, which is a black
# rectangle, not a redaction.
#
# So each class gets three numbers instead of one:
#   score_threshold    - below the calibrated value, above the noise floor
#   max_area_fraction  - a plausibility cap; a single detection larger than
#                        this share of the image is junk for that class
#   dilation/expansion - generous, so edges of covered content do not survive
#
# Reference points from the V2 validation calibration (see
# threshold_profile_v2_validation_calibrated.yaml and reports/): face 0.65,
# plate 0.25, body 0.35, nudity 0.10, rare classes 0.05-0.80.
#
# Rules match provider+class, then provider+*, then *+class, then *+*. Class
# rules are the tuning surface so tiled providers inherit their parent's
# behaviour. Every class stays mandatory_review: the interface must keep saying
# what it is unsure about.
#
# release_ready stays false: this is not calibrated release evidence, and in
# personal policy mode that flag is shown as a warning rather than blocking.
profile_id: threshold-profile-personal-max-coverage
release_ready: false
rules:
# --- Faces: the strongest class. 0.40 against a calibrated 0.65.
- provider: '*'
  privacy_class: a105_face_all
  score_threshold: 0.4
  min_area_pixels: 12
  expansion_fraction: 0.08
  dilation_pixels: 6
  max_area_fraction: 0.35
  mandatory_review: true
- provider: '*'
  privacy_class: face
  score_threshold: 0.4
  min_area_pixels: 12
  expansion_fraction: 0.1
  dilation_pixels: 6
  max_area_fraction: 0.35
  mandatory_review: true
# --- Plates: small, oblique, often missed, and never large in a photo.
- provider: '*'
  privacy_class: a108_license_plate_all
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.18
  dilation_pixels: 6
  max_area_fraction: 0.12
  mandatory_review: true
- provider: '*'
  privacy_class: license_plate
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.18
  dilation_pixels: 6
  max_area_fraction: 0.12
  mandatory_review: true
# --- Bodies: accurate, and erasing one removes most of a photo, so the
# interface leaves this group off by default. The cap stays high on purpose.
- provider: '*'
  privacy_class: a109_person_body
  score_threshold: 0.35
  min_area_pixels: 64
  dilation_pixels: 4
  max_area_fraction: 0.95
  mandatory_review: true
# NudeNet reports intimate regions with its own score distribution; the trained
# a110 head above stays enabled so the two corroborate each other.
- provider: '*'
  privacy_class: nudity
  score_threshold: 0.35
  min_area_pixels: 24
  expansion_fraction: 0.12
  dilation_pixels: 8
  max_area_fraction: 0.6
  mandatory_review: true
- provider: '*'
  privacy_class: a110_nudity_all
  score_threshold: 0.15
  min_area_pixels: 32
  expansion_fraction: 0.08
  dilation_pixels: 8
  max_area_fraction: 0.6
  mandatory_review: true
  experimental: true
# --- Text: the biggest privacy win. The OCR detector carries this group; the
# learned handwriting head is weak (3% pixel recall) so it only adds recall.
- provider: '*'
  privacy_class: printed_text
  score_threshold: 0.25
  min_area_pixels: 8
  expansion_fraction: 0.12
  dilation_pixels: 5
  max_area_fraction: 0.3
  mandatory_review: true
- provider: '*'
  privacy_class: a26_handwriting
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.12
  dilation_pixels: 6
  max_area_fraction: 0.25
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: handwriting
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.12
  dilation_pixels: 6
  max_area_fraction: 0.25
  mandatory_review: true
  experimental: true
# --- Documents and biometrics: rare, weak, high consequence when missed, and
# physically small, so the area caps do most of the noise filtering.
- provider: '*'
  privacy_class: a8_signature
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.12
  dilation_pixels: 6
  max_area_fraction: 0.15
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: a7_fingerprint
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.1
  dilation_pixels: 6
  max_area_fraction: 0.15
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: a43_medicine
  score_threshold: 0.2
  min_area_pixels: 12
  expansion_fraction: 0.1
  dilation_pixels: 6
  max_area_fraction: 0.25
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: a39_disability_physical
  score_threshold: 0.3
  min_area_pixels: 12
  expansion_fraction: 0.08
  dilation_pixels: 6
  max_area_fraction: 0.4
  mandatory_review: true
  experimental: true
# --- Barcodes and QR: a decoded symbol is certain, so cover the quiet zone.
- provider: '*'
  privacy_class: barcode
  score_threshold: 0.0
  min_area_pixels: 4
  expansion_fraction: 0.25
  dilation_pixels: 8
  max_area_fraction: 0.3
  mandatory_review: true
# --- Anything a future provider reports, including unknown model classes.
- provider: '*'
  privacy_class: '*'
  score_threshold: 0.35
  min_area_pixels: 12
  expansion_fraction: 0.08
  dilation_pixels: 5
  max_area_fraction: 0.3
  mandatory_review: true
  experimental: true
