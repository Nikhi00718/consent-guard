# Personal-tool coverage profile.
#
# The validation-calibrated profile optimizes precision: on a real photo it
# discarded 212 of 276 detections and left one region to erase. For a personal
# redaction tool the trade is the other way round. A false alarm costs one
# un-erase click; a miss leaks. Thresholds are therefore low, geometry is
# expanded, and every class stays mandatory_review so the interface keeps
# telling the truth about what it is unsure of.
#
# Rules are matched provider+class, then provider+*, then *+class, then *+*.
# Class-level rules are the tuning surface here so that tiled providers
# (maskrcnn_tiled, plate_fasterrcnn_tiled, ...) inherit the same behavior as
# their single-pass parents.
#
# release_ready stays false: this is not calibrated release evidence, and in
# personal policy mode that flag becomes a visible warning instead of a lock.
profile_id: threshold-profile-personal-max-coverage
release_ready: false
rules:
# --- Faces: strongest class, so it can afford a moderate threshold.
- provider: '*'
  privacy_class: a105_face_all
  score_threshold: 0.3
  min_area_pixels: 8
  expansion_fraction: 0.08
  dilation_pixels: 8
  mandatory_review: true
- provider: '*'
  privacy_class: face
  score_threshold: 0.3
  min_area_pixels: 8
  expansion_fraction: 0.1
  dilation_pixels: 8
  mandatory_review: true
# --- Plates: small, oblique, and frequently missed. Cover generously.
- provider: '*'
  privacy_class: a108_license_plate_all
  score_threshold: 0.12
  min_area_pixels: 6
  expansion_fraction: 0.18
  dilation_pixels: 8
  mandatory_review: true
- provider: '*'
  privacy_class: license_plate
  score_threshold: 0.12
  min_area_pixels: 6
  expansion_fraction: 0.18
  dilation_pixels: 8
  mandatory_review: true
# --- Bodies: accurate, but erasing one destroys most of a photo. The interface
# leaves this group switched off by default; the rule exists for when it is on.
- provider: '*'
  privacy_class: a109_person_body
  score_threshold: 0.4
  min_area_pixels: 32
  dilation_pixels: 4
  mandatory_review: true
- provider: '*'
  privacy_class: a110_nudity_all
  score_threshold: 0.05
  min_area_pixels: 8
  expansion_fraction: 0.1
  dilation_pixels: 10
  mandatory_review: true
  experimental: true
# --- Text: the largest privacy win and the weakest learned class. The OCR
# detector carries this group; the learned handwriting head only adds recall.
- provider: '*'
  privacy_class: printed_text
  score_threshold: 0.2
  min_area_pixels: 6
  expansion_fraction: 0.12
  dilation_pixels: 6
  mandatory_review: true
- provider: '*'
  privacy_class: a26_handwriting
  score_threshold: 0.06
  min_area_pixels: 6
  expansion_fraction: 0.15
  dilation_pixels: 8
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: handwriting
  score_threshold: 0.06
  min_area_pixels: 6
  expansion_fraction: 0.15
  dilation_pixels: 8
  mandatory_review: true
  experimental: true
# --- Documents and biometrics: rare, weak, and high consequence when missed.
- provider: '*'
  privacy_class: a8_signature
  score_threshold: 0.06
  min_area_pixels: 6
  expansion_fraction: 0.15
  dilation_pixels: 8
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: a7_fingerprint
  score_threshold: 0.06
  min_area_pixels: 6
  expansion_fraction: 0.12
  dilation_pixels: 8
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: a43_medicine
  score_threshold: 0.08
  min_area_pixels: 8
  expansion_fraction: 0.12
  dilation_pixels: 8
  mandatory_review: true
  experimental: true
- provider: '*'
  privacy_class: a39_disability_physical
  score_threshold: 0.15
  min_area_pixels: 8
  expansion_fraction: 0.1
  dilation_pixels: 8
  mandatory_review: true
  experimental: true
# --- Barcodes and QR: a decoded symbol is certain, so cover the quiet zone.
- provider: '*'
  privacy_class: barcode
  score_threshold: 0.0
  min_area_pixels: 4
  expansion_fraction: 0.25
  dilation_pixels: 8
  mandatory_review: true
# --- Anything a future provider reports, including unknown model classes.
- provider: '*'
  privacy_class: '*'
  score_threshold: 0.2
  min_area_pixels: 8
  expansion_fraction: 0.1
  dilation_pixels: 6
  mandatory_review: true
  experimental: true
