profile_id: threshold-profile-candidate-v1
release_ready: false

# These values prioritize candidate recall and mandatory review.  They are not
# production-calibrated; Stage 04 must replace them using frozen validation data.
rules:
  - {provider: maskrcnn, privacy_class: a105_face_all, score_threshold: 0.25, min_area_pixels: 16, dilation_pixels: 4, mandatory_review: true}
  - {provider: maskrcnn, privacy_class: a108_license_plate_all, score_threshold: 0.20, min_area_pixels: 12, expansion_fraction: 0.08, dilation_pixels: 4, mandatory_review: true}
  - {provider: maskrcnn, privacy_class: a109_person_body, score_threshold: 0.50, min_area_pixels: 32, dilation_pixels: 3, mandatory_review: true}
  - {provider: maskrcnn, privacy_class: a110_nudity_all, score_threshold: 0.15, min_area_pixels: 12, dilation_pixels: 5, mandatory_review: true, experimental: true}
  - {provider: maskrcnn, privacy_class: a26_handwriting, score_threshold: 0.10, min_area_pixels: 8, dilation_pixels: 4, mandatory_review: true, experimental: true}
  - {provider: maskrcnn, privacy_class: a39_disability_physical, score_threshold: 0.15, min_area_pixels: 12, dilation_pixels: 4, mandatory_review: true, experimental: true}
  - {provider: maskrcnn, privacy_class: a43_medicine, score_threshold: 0.15, min_area_pixels: 12, dilation_pixels: 4, mandatory_review: true, experimental: true}
  - {provider: maskrcnn, privacy_class: a7_fingerprint, score_threshold: 0.15, min_area_pixels: 8, dilation_pixels: 5, mandatory_review: true, experimental: true}
  - {provider: maskrcnn, privacy_class: a8_signature, score_threshold: 0.15, min_area_pixels: 8, dilation_pixels: 4, mandatory_review: true, experimental: true}
  - {provider: yunet, privacy_class: face, score_threshold: 0.35, min_area_pixels: 16, expansion_fraction: 0.12, dilation_pixels: 4, mandatory_review: true}
  - {provider: plate_fasterrcnn, privacy_class: license_plate, score_threshold: 0.20, min_area_pixels: 12, expansion_fraction: 0.12, dilation_pixels: 4, mandatory_review: true}
  - {provider: paddleocr, privacy_class: printed_text, score_threshold: 0.20, min_area_pixels: 8, expansion_fraction: 0.05, dilation_pixels: 3, mandatory_review: true}
  - {provider: paddleocr, privacy_class: handwriting, score_threshold: 0.20, min_area_pixels: 8, expansion_fraction: 0.05, dilation_pixels: 3, mandatory_review: true}
  - {provider: zxingcpp, privacy_class: barcode, score_threshold: 0.00, min_area_pixels: 8, expansion_fraction: 0.08, dilation_pixels: 3, mandatory_review: true}
  - {provider: '*', privacy_class: '*', score_threshold: 0.50, min_area_pixels: 16, dilation_pixels: 3, mandatory_review: true, experimental: true}
